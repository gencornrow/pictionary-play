services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Required: your Supabase/Lovable Cloud credentials.
      # Copy these from your .env or set them in the host environment.
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    env_file:
      - .env
