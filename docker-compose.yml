services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    volumes:
      # Database files survive container restarts.
      - pgdata:/var/lib/postgresql/data
      # Creates all tables automatically on first start.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard -d whiteboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # These are inlined into the browser bundle at build time. Only used in
      # cloud mode; harmless to leave empty for a fully local setup.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Backend switch: "local" uses the Postgres container below.
      # Set DATA_BACKEND=cloud to point the Docker container at the cloud
      # database instead (requires the SUPABASE_* variables from .env).
      DATA_BACKEND: ${DATA_BACKEND:-local}
      DATABASE_URL: postgres://whiteboard:whiteboard@db:5432/whiteboard
      # Cloud-mode credentials (read from .env when present).
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
      VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-}
    env_file:
      - .env

volumes:
  pgdata:
